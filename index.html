<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111411" />
    <title>rwp</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111411;
        --fg: #d9e1d7;
        --muted: #829083;
        --accent: #a8cba0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.75 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      main {
        max-width: 790px;
        margin: 0 auto;
        padding: clamp(36px, 9vh, 100px) 24px 100px;
      }
      h1 {
        font-size: 16px;
        font-weight: 500;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 12px;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      a:hover {
        color: #e1f4d9;
      }
      .muted,
      small {
        color: var(--muted);
      }
      .welcome {
        margin-bottom: 32px;
      }
      .welcome p {
        color: var(--muted);
      }
      .prompt {
        color: var(--accent);
        white-space: nowrap;
      }
      .line,
      .input-line {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .input-line {
        margin-top: 8px;
      }
      .input-line input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        color: var(--fg);
        font: inherit;
        caret-color: var(--accent);
        padding: 0;
      }
      .entry {
        margin: 0 0 28px;
      }
      .result {
        padding: 10px 0 0 0;
      }
      .result h2 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 10px;
        color: var(--accent);
      }
      .result .item {
        margin: 0 0 16px;
      }
      .result .item strong {
        font-weight: 500;
      }
      .result .item small {
        display: block;
      }
      .result .item p {
        margin: 3px 0;
      }
      .result .section {
        margin-bottom: 16px;
      }
      .pill {
        display: inline-block;
        margin: 0 14px 5px 0;
        color: var(--fg);
      }
      .error {
        color: #e6a6a6;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      ::selection {
        background: #536f52;
        color: white;
      }
      @media (max-width: 500px) {
        main {
          padding: 40px 18px 80px;
        }
        body {
          font-size: 12px;
        }
        .line,
        .input-line {
          gap: 8px;
        }
        .result h2 {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main id="terminal">
      <div class="welcome" id="welcome">
        <h1>Roya Parsa</h1>
        <p>ML researcher &amp; AI engineer.<br />Dartmouth College.</p>
        <p>
          Commands:
          <span style="color: var(--fg)"
            >about · research · stack · contact · resume</span
          ><br />Type <span style="color: var(--accent)">help</span> for more.
        </p>
      </div>
      <div id="history" aria-live="polite"></div>
      <form id="form" autocomplete="off">
        <label class="sr-only" for="command">Terminal command</label>
        <div class="input-line">
          <span class="prompt">~ $</span
          ><input
            id="command"
            autofocus
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Type a command"
          />
        </div>
      </form>
    </main>
    <script>
      (() => {
        "use strict";
        const input = document.getElementById("command"),
          form = document.getElementById("form"),
          historyEl = document.getElementById("history"),
          welcome = document.getElementById("welcome");
        const commands = [
          "about",
          "research",
          "stack",
          "contact",
          "resume",
          "help",
          "clear",
        ];
        let past = [],
          cursor = 0;
        const content = {
          help: `<h2>Available commands</h2><div class="section"><p><strong>about</strong> &nbsp;&nbsp; — who I am and what drives me<br><strong>research</strong> — selected research and engineering work<br><strong>stack</strong> &nbsp;&nbsp; — languages, tools, and methods<br><strong>contact</strong> &nbsp; — find me elsewhere<br><strong>resume</strong> &nbsp; — download my résumé<br><strong>clear</strong> &nbsp;&nbsp; — clear terminal output<br><strong>help</strong> &nbsp;&nbsp;&nbsp; — show this list</p><p class="muted">Tip: use ↑ / ↓ to recall commands, or Tab to autocomplete.</p></div>`,
          about: `<h2>About me</h2><p>I'm Roya Parsa, a Computer Science master's student at Dartmouth and a researcher in the Hassanpour Lab. My work sits at the intersection of machine learning research and practical engineering.</p><p>I work on biomedical foundation models, computational pathology, medical imaging, and model reliability. I'm particularly interested in what makes AI systems trustworthy outside carefully controlled benchmarks.</p><p>Previously, I've worked on computer vision for proton therapy, interdisciplinary AI and ecology research, and embedded software engineering.</p><p class="muted">Beyond code: horseback riding, good stories, and a growing collection of side projects.</p>`,
          research: `<h2>Research</h2><div class="item"><strong>01 / AI for Biodiversity</strong><small>Ohio State University · Imageomics Institute · 2026–2027</small><p>AI Research Fellow conducting imageomics and field research in Hawaiʻi, investigating computational approaches to biodiversity conservation and local flora degradation. Exploring how AI and computer vision can support ecological monitoring and conservation.</p></div>
  <div class="item">
    <strong>02 / Robustness of Medical Foundation Models</strong>
    <small>Hassanpour Lab · Dartmouth · Master's Thesis</small>
    <p>Investigating how medical foundation models degrade under temporal distribution shift, rare-disease representation, and recursive synthetic-data generation. Designing controlled experiments across five drift scenarios to characterize failure modes, quantify performance degradation, and evaluate mitigation strategies.</p>
    <a href="https://github.com/rparsa49/medgemma-ct-robustness" target="_blank" rel="noopener noreferrer">Research repository ↗</a>
  </div>
  <div class="item">
    <strong>03 / Computational Pathology & Rare Diseases</strong>
    <small>Hassanpour Lab · Dartmouth</small>
    <p>Developing multimodal models combining Prov-GigaPath whole-slide pathology embeddings with clinical serology to classify four liver diseases across 267 slides from 197 patients, achieving 73% held-out accuracy and 0.72 macro-F1. Investigating representation-level failure modes, including AIH-to-PBC (31.5%) and PSC-to-PBC (29.8%) misclassification, and adapting pretrained slide encoders through LoRA. Built reproducible HPC preprocessing pipelines for 1,200+ gigapixel images using SLURM and Apptainer.</p>
  </div>
  <div class="item">
    <strong>04 / Real-Time Ultrasound for Cervical Cancer Screening</strong>
    <small>Hassanpour Lab · Dartmouth</small>
    <p>Co-leading development of a real-time YOLOv8-based ultrasound detection system for cervical cancer screening. Optimizing computer vision inference for low-latency operation and deployment in resource-constrained clinical environments.</p>
  </div><div class="item">
<strong>05 / Proton Therapy & Dual-Energy CT</strong>
<small>New York Proton Center · 2024–2025 · ESTRO 2027 Submission</small>
<p>Developed SPR-NET, a PyTorch U-Net framework for automated proton stopping-power prediction from dual-energy CT, improving performance over analytical methods by 60% in high-density regions. Built clinical CT benchmarking pipelines comparing single- and dual-energy methods, generating stopping-power maps with sub-1% deviation against Gammex reference values.</p>
<p>Additional research submitted to ESTRO 2027 evaluated TwinBeam dual-energy CT for proton therapy planning, comparing analytical decomposition methods and TissueXplorer against proton measurements and five head-and-neck treatment plans. Identified size-dependent stopping-power errors, elevated noise (8–12% for decomposition methods), and a 4–8% sub-surface SPR deficit. Developed and evaluated size-matching and depth-dependent corrections, reducing mean patient water-equivalent thickness differences to within 0.4% of single-energy CT while improving agreement with phantom measurements.</p><a href="https://github.com/rparsa49/NYPC-DCT" target="_blank" rel="noopener noreferrer">Research repository ↗</a></div>
`,

          stack: `<h2>Technical stack</h2><div class="section"><p class="muted">LANGUAGES & DATA</p><span class="pill">Python</span><span class="pill">SQL</span><span class="pill">R</span><span class="pill">C / C++</span></div><div class="section"><p class="muted">MACHINE LEARNING</p><span class="pill">PyTorch</span><span class="pill">Transformers</span><span class="pill">Computer Vision</span><span class="pill">Foundation Models</span><span class="pill">LoRA</span><span class="pill">MIL</span><span class="pill">Calibration</span><span class="pill">Model Evaluation</span></div><div class="section"><p class="muted">ENGINEERING & SYSTEMS</p><span class="pill">LLM Agents</span><span class="pill">Tool Use</span><span class="pill">Git</span><span class="pill">Linux</span><span class="pill">Slurm / HPC</span><span class="pill">Streamlit</span><span class="pill">Vertex AI</span><span class="pill">Embedded Systems</span></div>`,
          contact: `<h2>Get in touch</h2><p>Interested in collaborating, hiring, or talking about an interesting research problem? I'd love to hear from you.</p><p>Email &nbsp;&nbsp;&nbsp; <a href="mailto:royaparsa294@gmail.com">royaparsa294@gmail.com ↗</a><br>GitHub &nbsp;&nbsp; <a href="https://github.com/rparsa49" target="_blank" rel="noopener noreferrer">github.com/rparsa49 ↗</a><br>LinkedIn &nbsp;<a href="https://www.linkedin.com/in/roya-parsa/" target="_blank" rel="noopener noreferrer">linkedin.com/in/roya-parsa ↗</a></p>`,
        };
        function run(raw) {
          const cmd = raw.trim().toLowerCase();
          if (!cmd) return;
          if (cmd === "clear") {
            historyEl.replaceChildren();
            welcome.hidden = true;
            input.value = "";
            return;
          }
          const entry = document.createElement("div");
          entry.className = "entry";
          const line = document.createElement("div");
          line.className = "line";
          const prompt = document.createElement("span");
          prompt.className = "prompt";
          prompt.textContent = "~ $";
          const word = document.createElement("span");
          word.textContent = raw;
          line.append(prompt, word);
          entry.append(line);
          const result = document.createElement("div");
          result.className = "result";
          if (cmd === "resume") {
            result.innerHTML =
              '<p><a href="Roya_Parsa_Resume.pdf" download>Download résumé ↓</a></p>';
            const a = document.createElement("a");
            a.href = "Roya_Parsa_Resume.pdf";
            a.download = "Roya_Parsa_Resume.pdf";
            document.body.append(a);
            a.click();
            a.remove();
          } else if (Object.hasOwn(content, cmd)) {
            result.innerHTML = content[cmd];
          } else {
            result.innerHTML =
              '<p class="error"></p><p class="muted">Type help for available commands.</p>';
            result.querySelector(".error").textContent =
              "Command not found: " + raw.trim();
          }
          entry.append(result);
          historyEl.append(entry);
          past.push(raw);
          cursor = past.length;
          input.value = "";
          input.scrollIntoView({ block: "nearest" });
        }
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          run(input.value);
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowUp") {
            e.preventDefault();
            cursor = Math.max(0, cursor - 1);
            input.value = past[cursor] || "";
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            cursor = Math.min(past.length, cursor + 1);
            input.value = past[cursor] || "";
          } else if (e.key === "Tab") {
            const typed = input.value.trim().toLowerCase(),
              matches = commands.filter((c) => c.startsWith(typed));
            if (matches.length === 1) {
              e.preventDefault();
              input.value = matches[0];
            }
          }
        });
        document.getElementById("terminal").addEventListener("click", (e) => {
          if (!e.target.closest("a,input")) input.focus();
        });
      })();
    </script>
  </body>
</html>
